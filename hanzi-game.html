<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="识字乐园">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    <title>快乐识字乐园 - 儿童汉字学习游戏</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --primary-dark: #ee5a6f;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --purple: #a55eea;
            --blue: #45b7d1;
            --pink: #ff9ff3;
            --green: #26de81;
            --orange: #fd9644;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-shadow: 0 10px 30px rgba(0,0,0,0.15);
            --radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
        }

        /* ===== 彩虹顶栏 ===== */
        .rainbow-bar {
            height: 6px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff, #5f27cd);
        }

        /* ===== 页面切换 ===== */
        .page {
            display: none;
            padding: 24px 20px;
            animation: pageIn 0.4s ease-out;
        }
        .page.active { display: block; }

        @keyframes pageIn {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== 首页 ===== */
        .home-header {
            text-align: center;
            padding: 20px 0 10px;
        }
        .home-title {
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,.2);
            letter-spacing: 4px;
        }
        .home-subtitle {
            color: rgba(255,255,255,.8);
            font-size: .95rem;
            margin-top: 6px;
        }

        /* 统计卡片 */
        .stats-row {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }
        .stat-card {
            flex: 1;
            background: #fff;
            border-radius: var(--radius);
            padding: 16px 8px;
            text-align: center;
            box-shadow: var(--card-shadow);
        }
        .stat-num {
            font-size: 2rem;
            font-weight: 800;
            color: var(--purple);
        }
        .stat-label {
            font-size: .8rem;
            color: #999;
            margin-top: 4px;
        }

        /* 待学/待复习信息 */
        .queue-info {
            background: rgba(255,255,255,.15);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .queue-item {
            text-align: center;
        }
        .queue-item .num {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
        }
        .queue-item .label {
            font-size: .8rem;
            color: rgba(255,255,255,.7);
            margin-top: 2px;
        }
        .queue-divider {
            width: 1px;
            height: 40px;
            background: rgba(255,255,255,.3);
        }

        /* 开始学习按钮 */
        .start-btn {
            display: block;
            width: 100%;
            padding: 22px;
            border: none;
            border-radius: 24px;
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, #00b894, #00cec9);
            box-shadow: 0 8px 30px rgba(0,184,148,.5);
            transition: transform .2s, box-shadow .2s;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 2px;
        }
        .start-btn:active { transform: scale(.96); }
        .start-btn .sub {
            display: block;
            font-size: .85rem;
            font-weight: 500;
            opacity: .85;
            margin-top: 4px;
            letter-spacing: 0;
        }

        /* ===== 学习页 ===== */
        .page-title {
            text-align: center;
            font-size: 1.4rem;
            color: #fff;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* 字符类型标签 */
        .char-type-tag {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: .85rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .tag-new {
            background: linear-gradient(135deg, #55efc4, #00b894);
            color: #fff;
        }
        .tag-review {
            background: linear-gradient(135deg, #feca57, #f39c12);
            color: #fff;
        }

        .learn-card {
            background: #fff;
            border-radius: 28px;
            padding: 36px 24px 28px;
            text-align: center;
            box-shadow: var(--card-shadow);
            position: relative;
        }

        .big-char {
            font-size: 10rem;
            line-height: 1.1;
            color: #2d3436;
            font-weight: 900;
            margin: 10px 0;
            text-shadow: 4px 4px 0 rgba(0,0,0,.06);
            user-select: none;
            animation: charPop .6s cubic-bezier(.17,.67,.35,1.5);
        }
        @keyframes charPop {
            0%   { transform: scale(.3) rotate(-8deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .big-pinyin {
            font-size: 1.8rem;
            color: var(--primary);
            font-weight: 700;
            margin: 8px 0;
        }
        .big-meaning {
            font-size: 1.2rem;
            color: #636e72;
        }
        .big-example {
            font-size: 1.05rem;
            color: #b2bec3;
            margin-top: 8px;
            font-style: italic;
        }

        /* 记忆等级指示器 */
        .memory-level {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .memory-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dfe6e9;
            transition: background .3s;
        }
        .memory-dot.active {
            background: #00b894;
        }
        .memory-dot.wrong {
            background: #ff7675;
        }
        .memory-label {
            font-size: .75rem;
            color: #b2bec3;
            margin-left: 6px;
        }

        .learn-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .learn-actions .btn {
            flex: 1;
        }

        /* 进度条 */
        .progress {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,.25);
            border-radius: 6px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00b894, #55efc4);
            border-radius: 6px;
            transition: width .5s ease;
        }
        .progress-text {
            font-size: .75rem;
            color: rgba(255,255,255,.8);
            text-align: right;
            margin-top: 4px;
        }

        /* ===== 通用按钮 ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: transform .15s, box-shadow .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(.95); }
        .btn-primary { background: linear-gradient(135deg, #00b894, #00cec9); box-shadow: 0 4px 15px rgba(0,184,148,.4); }
        .btn-orange { background: linear-gradient(135deg, #fdcb6e, #e17055); box-shadow: 0 4px 15px rgba(225,112,85,.4); }
        .btn-purple { background: linear-gradient(135deg, #a29bfe, #6c5ce7); box-shadow: 0 4px 15px rgba(108,92,231,.4); }
        .btn-pink   { background: linear-gradient(135deg, #fd79a8, #e84393); box-shadow: 0 4px 15px rgba(232,67,147,.4); }
        .btn-blue   { background: linear-gradient(135deg, #74b9ff, #0984e3); box-shadow: 0 4px 15px rgba(9,132,227,.4); }
        .btn-ghost {
            background: rgba(255,255,255,.15);
            box-shadow: none;
            font-size: .9rem;
            padding: 10px 18px;
        }
        .btn-full { width: 100%; }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn-row .btn { flex: 1; }

        /* ===== 结果页 ===== */
        .result-card {
            background: #fff;
            border-radius: 28px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: var(--card-shadow);
        }
        .result-emoji {
            font-size: 5rem;
            animation: bounce 1s ease-in-out infinite;
        }
        @keyframes bounce {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-16px); }
        }
        .result-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 12px 0;
        }
        .result-stars {
            font-size: 2.5rem;
            margin: 10px 0;
        }
        .result-stats {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin: 20px 0;
        }
        .result-stat-item { text-align: center; }
        .result-stat-num { font-size: 2rem; font-weight: 800; color: var(--purple); }
        .result-stat-label { font-size: .8rem; color: #999; }

        .result-detail {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }
        .result-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: .95rem;
            color: #636e72;
        }
        .result-detail-row .val { font-weight: 700; }
        .result-detail-row .val.green { color: #00b894; }
        .result-detail-row .val.orange { color: #e17055; }

        /* ===== 星星雨 ===== */
        .stars-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
        .star-particle {
            position: absolute;
            font-size: 2rem;
            animation: starFall 1.5s ease-in forwards;
        }
        @keyframes starFall {
            0%   { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
            100% { opacity: 0; transform: translateY(120vh) rotate(720deg) scale(.3); }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.8);
            background: rgba(0,0,0,.8);
            color: #fff;
            padding: 20px 40px;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 700;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all .3s;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* ===== 正确/错误反馈动画 ===== */
        @keyframes correctPulse {
            0%,100% { transform: scale(1); }
            50%     { transform: scale(1.08); }
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%     { transform: translateX(-8px); }
            40%     { transform: translateX(8px); }
            60%     { transform: translateX(-5px); }
            80%     { transform: translateX(5px); }
        }
        .feedback-correct {
            animation: correctPulse .5s;
        }
        .feedback-wrong {
            animation: shake .4s;
        }
        .feedback-msg {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            min-height: 36px;
            margin-top: 12px;
            transition: opacity .3s;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 360px) {
            .big-char { font-size: 7rem; }
        }
        @media (min-width: 768px) {
            .app { padding-top: 40px; }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="rainbow-bar"></div>

    <!-- ========== 首页 ========== -->
    <div id="page-home" class="page active">
        <div class="home-header">
            <div class="home-title">快乐识字乐园</div>
            <div class="home-subtitle">每天学一点，轻松识千字</div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-num" id="s-learned">0</div>
                <div class="stat-label">已学汉字</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="s-mastered">0</div>
                <div class="stat-label">已掌握</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="s-streak">0</div>
                <div class="stat-label">连续天数</div>
            </div>
        </div>

        <div class="queue-info">
            <div class="queue-item">
                <div class="num" id="s-review-count">0</div>
                <div class="label">待复习</div>
            </div>
            <div class="queue-divider"></div>
            <div class="queue-item">
                <div class="num" id="s-new-count">0</div>
                <div class="label">可学新字</div>
            </div>
        </div>

        <button class="start-btn" onclick="startLearning()">
            开始学习
            <span class="sub" id="start-sub">新字 + 复习，智能安排</span>
        </button>

        <div style="text-align:center;margin-top:20px;">
            <button class="btn btn-ghost" onclick="resetProgress()" style="color:rgba(255,255,255,.5);font-size:.8rem;">重置学习进度</button>
        </div>
    </div>

    <!-- ========== 学习页 ========== -->
    <div id="page-learn" class="page">
        <div class="page-title">快乐识字</div>
        <div class="progress"><div class="progress-bar" id="learn-prog"></div></div>
        <div class="progress-text" id="learn-prog-text">1 / 10</div>

        <div style="text-align:center;">
            <span class="char-type-tag tag-new" id="learn-tag">新字</span>
        </div>

        <div class="learn-card" id="learn-card">
            <div class="big-char" id="l-char">字</div>
            <div class="big-pinyin" id="l-pinyin">zì</div>
            <div class="big-meaning" id="l-meaning">汉字、文字</div>
            <div class="big-example" id="l-example">"我们学习了很多新汉字"</div>
        </div>

        <div class="learn-actions">
            <button class="btn btn-blue" onclick="speakChar()">发音</button>
            <button class="btn btn-orange" onclick="speakExample()">例句</button>
        </div>

        <div class="feedback-msg" id="learn-feedback"></div>

        <div class="btn-row">
            <button class="btn btn-primary" id="btn-no" onclick="learnMark(false)">不认识</button>
            <button class="btn btn-purple" id="btn-yes" onclick="learnMark(true)">认识</button>
        </div>

        <div style="text-align:center;margin-top:16px;">
            <button class="btn btn-ghost" onclick="goHome()">返回首页</button>
        </div>
    </div>

    <!-- ========== 结果页 ========== -->
    <div id="page-result" class="page">
        <div class="result-card">
            <div class="result-emoji" id="r-emoji">🎉</div>
            <div class="result-title" id="r-title">太棒了！</div>
            <div class="result-stars" id="r-stars"></div>
            <div class="result-stats">
                <div class="result-stat-item">
                    <div class="result-stat-num" id="r-correct">0</div>
                    <div class="result-stat-label">答对</div>
                </div>
                <div class="result-stat-item">
                    <div class="result-stat-num" id="r-total">0</div>
                    <div class="result-stat-label">总数</div>
                </div>
                <div class="result-stat-item">
                    <div class="result-stat-num" id="r-accuracy">0%</div>
                    <div class="result-stat-label">正确率</div>
                </div>
            </div>
            <div class="result-detail" id="r-detail"></div>
        </div>

        <div class="btn-row" style="margin-top:20px;">
            <button class="btn btn-primary" onclick="startLearning()">继续学习</button>
            <button class="btn btn-purple" onclick="goHome()">返回首页</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
</div>

<!-- 星星雨容器 -->
<div class="stars-rain" id="stars-rain"></div>

// 去重
const _seen = new Set();
const DB_UNIQ = DB.filter(d => {
    if (_seen.has(d.c)) return false;
    _seen.add(d.c);
    return true;
});

// ============================================================
//  艾宾浩斯记忆曲线间隔（天）
//  level 0: 刚学 → 1天后复习
//  level 1: 2天后
//  level 2: 4天后
//  level 3: 7天后
//  level 4: 15天后
//  level 5: 30天后 → 已掌握
// ============================================================
const INTERVALS = [1, 2, 4, 7, 15, 30];
const LEVEL_NAMES = ['刚学', '初识', '熟悉', '掌握', '巩固', '精通'];

// ============================================================
//  存储层 —— localStorage
// ============================================================
const STORE_KEY = 'hanzi乐园_v2';

function loadStore() {
    try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) return JSON.parse(raw);
        // 尝试从 v1 迁移
        const old = localStorage.getItem('hanzi乐园_v1');
        if (old) return JSON.parse(old);
        return defaultStore();
    } catch { return defaultStore(); }
}
function defaultStore() {
    return {
        learned: {},      // { char: { p, m, lv, nextTs, lastTs, correct, wrong } }
        streak: 0,
        lastDate: null,
        totalCorrect: 0,
        totalAnswered: 0,
    };
}
function saveStore(s) {
    localStorage.setItem(STORE_KEY, JSON.stringify(s));
}

let store = loadStore();

// ============================================================
//  辅助函数
// ============================================================
function today() { return new Date().toISOString().slice(0, 10); }
function addDays(dateStr, n) {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
}
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function $(id) { return document.getElementById(id); }
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    $(id).classList.add('active');
}
function goHome() {
    updateHomeStats();
    showPage('page-home');
}

// ---- 连续天数 ----
function updateStreak() {
    const t = today();
    if (store.lastDate === t) return;
    if (store.lastDate === addDays(t, -1)) {
        store.streak++;
    } else if (store.lastDate !== t) {
        store.streak = 1;
    }
    store.lastDate = t;
    saveStore(store);
}

// ---- 今日需复习字 ----
function getReviewChars() {
    const t = today();
    return Object.keys(store.learned).filter(c => store.learned[c].nextTs <= t);
}

// ---- 可学新字 ----
function getAvailableNewChars() {
    const learnedSet = new Set(Object.keys(store.learned));
    return DB_UNIQ.filter(d => !learnedSet.has(d.c));
}

// ---- 已掌握（lv >= 5）----
function getMasteredCount() {
    return Object.values(store.learned).filter(c => c.lv >= 5).length;
}

// ============================================================
//  首页统计
// ============================================================
function updateHomeStats() {
    updateStreak();
    $('s-learned').textContent = Object.keys(store.learned).length;
    $('s-mastered').textContent = getMasteredCount();
    $('s-streak').textContent = store.streak;

    const reviewCount = getReviewChars().length;
    const newCount = getAvailableNewChars().length;
    $('s-review-count').textContent = reviewCount;
    $('s-new-count').textContent = newCount;

    // 更新按钮副标题
    if (reviewCount > 0 && newCount > 0) {
        $('start-sub').textContent = reviewCount + ' 个复习 + ' + newCount + ' 个新字等你学';
    } else if (reviewCount > 0) {
        $('start-sub').textContent = reviewCount + ' 个汉字等你复习';
    } else if (newCount > 0) {
        $('start-sub').textContent = '来学新汉字吧！';
    } else {
        $('start-sub').textContent = '你已学完全部汉字，真厉害！';
    }
}

function showToast(text, duration = 1200) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
}
function starsRain() {
    const container = $('stars-rain');
    const emojis = ['⭐', '🌟', '✨', '💫', '🎉'];
    for (let i = 0; i < 20; i++) {
        const s = document.createElement('span');
        s.className = 'star-particle';
        s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        s.style.left = Math.random() * 100 + '%';
        s.style.top = '-40px';
        s.style.animationDelay = Math.random() * 0.8 + 's';
        s.style.animationDuration = (1 + Math.random()) + 's';
        container.appendChild(s);
        setTimeout(() => s.remove(), 3000);
    }
}

// ============================================================
//  Web Speech API — 发音（优化版）
// ============================================================
let zhVoice = null;  // 缓存选中的中文语音

function pickZhVoice() {
    const voices = speechSynthesis.getVoices();
    if (!voices.length) return;
    // 优先选择中文女声（更自然温暖，适合儿童）
    const preferred = ['zh-CN', 'cmn-Hans-CN', 'zh_TW', 'zh-HK'];
    // 优先选带 "female" 或 "xiaoxiao" 等自然语音标识的
    zhVoice = voices.find(v =>
        preferred.some(p => v.lang.startsWith(p)) &&
        (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('xiaoxiao') || v.name.toLowerCase().includes('xiaoyi') || v.name.toLowerCase().includes('tts'))
    );
    // 退而求其次：任意中文语音
    if (!zhVoice) {
        zhVoice = voices.find(v => preferred.some(p => v.lang.startsWith(p)));
    }
    // 再退：包含 "zh" 的
    if (!zhVoice) {
        zhVoice = voices.find(v => v.lang.includes('zh'));
    }
}

// 语音列表可能异步加载
if ('speechSynthesis' in window) {
    pickZhVoice();
    speechSynthesis.onvoiceschanged = pickZhVoice;
}

function speak(text, opts) {
    if (!('speechSynthesis' in window)) return;
    // 取消上一段未播完的语音
    speechSynthesis.cancel();

    const isSentence = (text.length > 2);  // 超过2个字视为句子（例句）
    const rate = (opts && opts.rate !== undefined) ? opts.rate : (isSentence ? 0.85 : 0.7);
    const pitch = (opts && opts.pitch !== undefined) ? opts.pitch : 1.05;

    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = rate;
    u.pitch = pitch;
    if (zhVoice) u.voice = zhVoice;

    // 例句语速稍快，自然流畅
    if (isSentence) {
        u.rate = 0.9;
    }

    speechSynthesis.speak(u);
}

// ============================================================
//  统一学习模式 —— 新字 + 复习混合
// ============================================================
const BATCH_SIZE = 10;  // 每轮 10 个字
const MAX_REVIEW = 6;   // 最多 6 个复习
const MAX_NEW = 8;      // 最多 8 个新字

let learnQueue = [];    // [{c, p, m, e, type:'new'|'review', lv?}]
let learnIdx = 0;
let sessionCorrect = 0;
let sessionWrong = 0;
let sessionNewCount = 0;
let sessionReviewCount = 0;
let sessionReviewCorrect = 0;
let marking = false;    // 防止连续点击

function startLearning() {
    // 收集复习字
    const reviewChars = getReviewChars();
    // 收集新字（优先 lv=1，不够再扩展到 lv=2）
    const allNew = getAvailableNewChars();

    let reviewList = [];
    let newList = [];

    // 优先复习（最多 MAX_REVIEW 个）
    if (reviewChars.length > 0) {
        reviewList = shuffle(reviewChars).slice(0, MAX_REVIEW).map(c => {
            const s = store.learned[c];
            // 找到 DB 中对应的完整信息（含例句）
            const dbEntry = DB_UNIQ.find(d => d.c === c);
            return {
                c: c,
                p: s.p,
                m: s.m,
                e: dbEntry ? dbEntry.e : (s.m + s.p),
                type: 'review',
                lv: s.lv
            };
        });
    }

    // 新字（填充到 BATCH_SIZE）
    const needNew = BATCH_SIZE - reviewList.length;
    if (needNew > 0 && allNew.length > 0) {
        // 优先 lv=1
        const lv1New = allNew.filter(d => d.lv === 1);
        const lv2New = allNew.filter(d => d.lv === 2);
        const pool = [...shuffle(lv1New), ...shuffle(lv2New)];
        const picked = pool.slice(0, Math.min(needNew, MAX_NEW));
        newList = picked.map(d => ({
            c: d.c,
            p: d.p,
            m: d.m,
            e: d.e,
            type: 'new',
            lv: -1
        }));
    }

    // 合并并打乱顺序
    learnQueue = shuffle([...reviewList, ...newList]);

    if (learnQueue.length === 0) {
        showToast('你已经学完所有汉字了！太厉害了！ 🎉');
        return;
    }

    learnIdx = 0;
    sessionCorrect = 0;
    sessionWrong = 0;
    sessionNewCount = newList.length;
    sessionReviewCount = reviewList.length;
    sessionReviewCorrect = 0;
    marking = false;

    showPage('page-learn');
    showLearnCard();
}

function showLearnCard() {
    if (learnIdx >= learnQueue.length) {
        // 本轮结束
        showSessionResult();
        return;
    }

    marking = false;
    const item = learnQueue[learnIdx];

    // 更新类型标签
    const tag = $('learn-tag');
    if (item.type === 'new') {
        tag.textContent = '新字';
        tag.className = 'char-type-tag tag-new';
    } else {
        const lvName = item.lv >= 0 && item.lv < LEVEL_NAMES.length ? LEVEL_NAMES[item.lv] : '复习';
        tag.textContent = '复习 · ' + lvName;
        tag.className = 'char-type-tag tag-review';
    }

    // 更新卡片内容
    $('l-char').textContent = item.c;
    $('l-pinyin').textContent = item.p;
    $('l-meaning').textContent = item.m;
    $('l-example').textContent = '"' + item.e + '"';

    // 重新触发动画
    $('l-char').style.animation = 'none';
    $('l-char').offsetHeight;
    $('l-char').style.animation = '';

    // 清除反馈
    $('learn-feedback').textContent = '';
    $('learn-feedback').className = 'feedback-msg';
    $('learn-card').className = 'learn-card';

    // 进度
    const pct = Math.round((learnIdx / learnQueue.length) * 100);
    $('learn-prog').style.width = pct + '%';
    $('learn-prog-text').textContent = (learnIdx + 1) + ' / ' + learnQueue.length;

    // 自动发音（复习字自动发音，新字不自动发音让孩子先看）
    if (item.type === 'review') {
        setTimeout(() => speak(item.c), 300);
    }
}

function learnMark(known) {
    if (marking) return;
    marking = true;

    const item = learnQueue[learnIdx];
    const card = $('learn-card');
    const feedback = $('learn-feedback');

    if (known) {
        sessionCorrect++;
        card.classList.add('feedback-correct');

        if (item.type === 'new') {
            // 新字 → 加入 learned，设 lv=0
            store.learned[item.c] = {
                p: item.p,
                m: item.m,
                lv: 0,
                nextTs: addDays(today(), INTERVALS[0]),
                lastTs: today(),
                correct: 1,
                wrong: 0,
            };
            feedback.textContent = '✅ 记住了！明天复习哦';
            feedback.style.color = '#00b894';
        } else {
            // 复习字 → 升级记忆
            sessionReviewCorrect++;
            updateMemory(item.c, true);
            feedback.textContent = '✅ 太棒了！记忆升级';
            feedback.style.color = '#00b894';
        }
        speak(item.c);
    } else {
        sessionWrong++;
        card.classList.add('feedback-wrong');

        if (item.type === 'new') {
            // 新字不认识 → 也加入 learned，但 wrong 计数
            store.learned[item.c] = {
                p: item.p,
                m: item.m,
                lv: 0,
                nextTs: addDays(today(), INTERVALS[0]),
                lastTs: today(),
                correct: 0,
                wrong: 1,
            };
            feedback.textContent = '没关系，记住啦！明天再来';
            feedback.style.color = '#e17055';
        } else {
            // 复习不认识 → 降级
            updateMemory(item.c, false);
            feedback.textContent = '再看一遍，很快记住的';
            feedback.style.color = '#e17055';
        }
        // 不认识时多读几遍加深印象
        speak(item.c);
    }

    store.totalAnswered++;
    if (known) store.totalCorrect++;
    saveStore(store);

    // 延迟后进入下一个
    setTimeout(() => {
        learnIdx++;
        showLearnCard();
    }, known ? 800 : 1200);
}

function speakChar() {
    if (learnIdx < learnQueue.length) {
        speak(learnQueue[learnIdx].c);
    }
}
function speakExample() {
    if (learnIdx < learnQueue.length) {
        speak(learnQueue[learnIdx].e);
    }
}

// ============================================================
//  记忆曲线更新
// ============================================================
function updateMemory(char, isCorrect) {
    if (!store.learned[char]) return;
    const rec = store.learned[char];
    rec.lastTs = today();

    if (isCorrect) {
        rec.correct++;
        rec.lv = Math.min(rec.lv + 1, INTERVALS.length);  // max lv = 6
        rec.nextTs = addDays(today(), INTERVALS[Math.min(rec.lv, INTERVALS.length - 1)]);
    } else {
        rec.wrong++;
        rec.lv = Math.max(0, rec.lv - 1);
        rec.nextTs = addDays(today(), INTERVALS[0]);  // 退回1天后
    }
}

// ============================================================
//  本轮结果页
// ============================================================
function showSessionResult() {
    const total = sessionCorrect + sessionWrong;
    const accuracy = total > 0 ? Math.round((sessionCorrect / total) * 100) : 0;

    let emoji, title;
    if (accuracy >= 90) { emoji = '🏆'; title = '太厉害了！'; starsRain(); }
    else if (accuracy >= 70) { emoji = '🎉'; title = '真棒！'; starsRain(); }
    else if (accuracy >= 50) { emoji = '😊'; title = '不错哦！'; }
    else { emoji = '💪'; title = '继续加油！'; }

    let stars = '';
    const starCount = accuracy >= 90 ? 3 : accuracy >= 70 ? 2 : accuracy >= 50 ? 1 : 0;
    for (let i = 0; i < 3; i++) {
        stars += i < starCount ? '⭐' : '☆';
    }

    $('r-emoji').textContent = emoji;
    $('r-title').textContent = title;
    $('r-stars').textContent = stars;
    $('r-correct').textContent = sessionCorrect;
    $('r-total').textContent = total;
    $('r-accuracy').textContent = accuracy + '%';

    // 详细信息
    let detailHTML = '';
    detailHTML += '<div class="result-detail-row"><span>新学汉字</span><span class="val green">' + sessionNewCount + ' 个</span></div>';
    detailHTML += '<div class="result-detail-row"><span>复习汉字</span><span class="val">' + sessionReviewCount + ' 个</span></div>';
    if (sessionReviewCount > 0) {
        detailHTML += '<div class="result-detail-row"><span>复习正确</span><span class="val green">' + sessionReviewCorrect + ' / ' + sessionReviewCount + '</span></div>';
    }
    detailHTML += '<div class="result-detail-row"><span>累计已学</span><span class="val">' + Object.keys(store.learned).length + ' 个</span></div>';
    const remainingReview = getReviewChars().length;
    if (remainingReview > 0) {
        detailHTML += '<div class="result-detail-row"><span>待复习</span><span class="val orange">' + remainingReview + ' 个</span></div>';
    }
    $('r-detail').innerHTML = detailHTML;

    showPage('page-result');
}

// ============================================================
//  重置进度
// ============================================================
function resetProgress() {
    if (confirm('确定要重置所有学习进度吗？这会清空已学记录。')) {
        store = defaultStore();
        saveStore(store);
        updateHomeStats();
        showToast('已重置，重新开始吧！');
    }
}

// ============================================================
//  初始化
// ============================================================
updateHomeStats();

// ============================================================
//  Service Worker 注册（PWA 离线支持）
// ============================================================
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
            .then((reg) => console.log('SW registered:', reg.scope))
            .catch((err) => console.log('SW registration failed:', err));
    });
}
</script>
